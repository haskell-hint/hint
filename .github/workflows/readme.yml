name: Readme

on:
  # Run once a month, to detect unexpected regressions
  schedule:
    - cron: '0 0 1 * *'

  # Allow manual triggering from the GitHub UI
  workflow_dispatch:

jobs:
  readme:
    name: Run code from README.md
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache@v4
      name: Cache Stack Artifacts
      with:
        path: |
          ~/.stack
          .stack-work
        key: ${{ runner.os }}-stack-${{ hashFiles('stack-8.10.7.yaml') }}

    - uses: haskell/actions/setup@v1
      id: setup-haskell-stack
      name: Setup Stack
      with:
        enable-stack: true
        stack-setup-ghc: true
        stack-no-global: true

    - name: Extract and run code
      run: |
        TEST_FILE="TEST_Readme.hs"

        # Extract code from the fenced code block in README.md
        CODE="$(awk 'f && /^```/{f=0} f{print} /^```haskell/{f=1}' README.md)"

        echo "module T where" > "$TEST_FILE"
        echo "$CODE" >> "$TEST_FILE"

        # {-# LANGUAGE LambdaCase, ScopedTypeVariables, TypeApplications #-}
        EXTS_LINE="$(echo "$CODE" | head -n 1)"

        # LambdaCase
        # ScopedTypeVariables
        # TypeApplications
        EXTS="$(echo "$EXTS_LINE" | tr ' ' '\n' | grep -v '#' | grep -v "LANGUAGE" | tr -d ',')"

        # -XLambdaCase
        # -XScopedTypeVariables
        # -XTypeApplications
        DOCTEST_FLAGS="$(echo "$EXTS" | grep -v '^$' | sed 's/^/-X/g')"


        stack --stack-yaml="stack-8.10.7.yaml" install doctest
        stack exec -- doctest $DOCTEST_FLAGS $TEST_FILE
